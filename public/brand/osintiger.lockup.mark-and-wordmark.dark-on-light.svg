<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OSINTiger logo with wordmark">
  <title>OSINTiger</title>
  <desc>OSINTiger brand mark with monospaced wordmark, on white.</desc>

  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Mark, scaled to upper 60% of canvas -->
  <g transform="translate(0, -52)">
    <circle cx="256" cy="200" r="128" fill="#0A0A0A"/>
    <g transform="rotate(22 256 200)">
      <rect x="246" y="22" width="20" height="356" fill="#FFFFFF"/>
    </g>
    <rect x="222" y="394" width="68" height="8" fill="#22E36A"/>
  </g>

  <!--
    Wordmark: "OSINTiger" in a monospaced family matching the OSINTiger product UI.
    System stack: JetBrains Mono → Berkeley Mono → Geist Mono → SF Mono → Menlo → Consolas.
  -->
  <text x="256" y="430"
        text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'Berkeley Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="50"
        font-weight="600"
        letter-spacing="-1"
        fill="#0A0A0A">OSINTiger</text>
</svg>
